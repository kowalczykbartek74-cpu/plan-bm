<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan zajęć · Zdawalni</title><meta name="robots" content="noindex">
<!-- Przeniesienie ustawień ze starego adresu plan.skrotbm.pl (repo plan-skrotbm-przekierowanie).
     Przeglądarka trzyma wybraną grupę, podgrupę, kierunek, motyw i język osobno dla każdej domeny, więc stara strona
     zbiera klucze bm-* i plan-* i przekazuje je tutaj w części adresu po # (ta część nie trafia na żaden serwer).
     Zapisujemy tylko klucze, których tu jeszcze nie ma (nowsze ustawienia z plan.zdawalni.pl wygrywają), czyścimy adres
     i otwieramy plan tam, gdzie ktoś chciał wejść (np. #/wefiz/zarz/1/c151 albo ?k=zarz26). -->
<style>
:root{--bg:#F4F5F0;--card:#FFFFFF;--ink:#10231A;--muted:#3E5046;--acc:#1A7F45;--on:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A14;--card:#17271E;--ink:#E8F2EC;--muted:#A9BDB1;--acc:#4ADE8B;--on:#0B2A18;color-scheme:dark}}
body{font:16px/1.5 "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box;background:var(--bg);color:var(--ink)}
.k{background:var(--card);border-radius:32px;padding:28px 26px;max-width:420px;width:100%;box-sizing:border-box;box-shadow:0 1px 2px rgba(16,35,26,.06),0 10px 28px -14px rgba(16,35,26,.22);display:grid;gap:14px;text-align:center}
.k b{font:600 24px/1.2 "Bricolage Grotesque","Plus Jakarta Sans","Trebuchet MS",sans-serif;letter-spacing:-.015em}
.k p{margin:0;color:var(--muted)}
.k a{justify-self:center;display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--acc);color:var(--on);font-weight:700;text-decoration:none}
</style>
<script>
(function () {
  var cel = "/";
  try {
    var p = new URLSearchParams(location.hash.slice(1));
    var c = p.get("cel") || "/";
    if (/^\/(?!\/)/.test(c) && !/^\/przenies\.html/.test(c)) cel = c;
    var d = p.get("d");
    if (d) {
      var b = d.replace(/-/g, "+").replace(/_/g, "/");
      while (b.length % 4) b += "=";
      var dane = JSON.parse(decodeURIComponent(escape(atob(b))));
      Object.keys(dane).forEach(function (k) {
        if (!/^(bm-|plan-)/.test(k) || typeof dane[k] !== "string") return;
        if (localStorage.getItem(k) === null) localStorage.setItem(k, dane[k]);
      });
    }
  } catch (e) { /* uszkodzony adres albo brak localStorage: po prostu otwieramy plan */ }
  location.replace(cel);
})();
</script></head>
<body><main class="k"><b>Otwieram plan zajęć…</b><p>Przenoszę Twoje ustawienia na nowy adres. Opening your timetable…</p><a href="/">plan.zdawalni.pl</a></main></body></html>
