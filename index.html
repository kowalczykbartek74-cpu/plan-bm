<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Skrót BM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: warm study desk. Sticky tab bar, a two-column hub (today + news | deadlines), subjects as notebook covers, month calendar with shared deadlines. */
:root {
  --paper: #faf6f1;
  --surface: #ffffff;
  --sunk: #f3ece4;
  --ink: #2b2130;
  --muted: #76687a;
  --line: #ebe1d6;
  --accent: #7a3e8f;
  --accent-ink: #ffffff;
  --accent-soft: #f3e8f5;
  --sun: #f2a33a;
  --today-bg: #2b2130;
  --today-ink: #faf6f1;
  --sun-soft: #fdf0db;
  --mark: rgba(242, 163, 58, 0.38);
  --good: #3f8a52; --good-soft: #e3f2e6;
  --bad: #c0472f; --bad-soft: #fbe4de;
  --shadow: 0 1px 2px rgba(60, 35, 50, 0.06), 0 8px 24px -12px rgba(60, 35, 50, 0.18);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1520; --surface: #241d2a; --sunk: #1f1925; --ink: #f2ebf3; --muted: #b2a3b6; --line: #382e3f;
    --accent: #cc9ee2; --accent-ink: #1a1520; --accent-soft: #3a2a45; --sun: #f5b45c; --today-bg: #33273b; --today-ink: #f2ebf3; --sun-soft: #3a2c1a; --mark: rgba(245, 180, 92, 0.3);
    --good: #74c98a; --good-soft: #1f3324; --bad: #ee8a72; --bad-soft: #3d231e;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1520; --surface: #241d2a; --sunk: #1f1925; --ink: #f2ebf3; --muted: #b2a3b6; --line: #382e3f;
  --accent: #cc9ee2; --accent-ink: #1a1520; --accent-soft: #3a2a45; --sun: #f5b45c; --today-bg: #33273b; --today-ink: #f2ebf3; --sun-soft: #3a2c1a; --mark: rgba(245, 180, 92, 0.3);
  --good: #74c98a; --good-soft: #1f3324; --bad: #ee8a72; --bad-soft: #3d231e;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; text-wrap: balance; margin: 0; letter-spacing: -0.015em; }
h1 { font-size: clamp(1.8rem, 4.6vw, 2.6rem); font-weight: 800; }
h2 { font-size: 1.3rem; font-weight: 800; }
h3 { font-size: 1.06rem; font-weight: 600; }
p { margin: 0; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; transform: rotate(-4deg); box-shadow: 3px 3px 0 var(--sun); }
.brand b { font-family: var(--f-display); font-size: 1.2rem; font-weight: 800; }
.nav { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
.navbtn { text-decoration: none; border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--muted); }
.navbtn:hover { color: var(--ink); background: var(--sunk); }
.navbtn[aria-current="page"] { background: var(--ink); color: var(--paper); }
.navbtn .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--sun); color: #2b2130; font-size: .74rem; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: .92rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.sun { background: var(--sun); color: #2b2130; border-color: var(--sun); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 12px; font-size: .84rem; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 700; text-decoration: none; }
.link:hover { text-decoration: underline; }

main { padding-block: 28px 72px; display: flex; flex-direction: column; gap: 32px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.eyebrow { font-family: var(--f-mono); font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.mark { background: linear-gradient(transparent 60%, var(--mark) 60%); padding: 0 3px; }

/* hub */
.greet { display: grid; gap: 8px; }
.greet .sub { color: var(--muted); font-size: 1.02rem; }
.hub { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .hub { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.today { background: var(--today-bg); color: var(--today-ink); border: 0; position: relative; overflow: hidden; }
.today .eyebrow { color: color-mix(in srgb, var(--today-ink) 65%, transparent); }
.today::after { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: var(--sun); opacity: .9; }
.today > * { position: relative; z-index: 1; }
.classes { display: grid; gap: 2px; }
.cls { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid color-mix(in srgb, var(--today-ink) 14%, transparent); }
.cls:first-child { border-top: 0; }
.cls .time { font-family: var(--f-mono); font-size: .86rem; }
.cls .name { font-weight: 700; display: flex; align-items: center; gap: 8px; min-width: 0; }
.cls .name span { overflow-wrap: anywhere; }
.cls .where { font-size: .82rem; opacity: .75; grid-column: 2; }
.cls .kind { grid-row: 1 / span 2; grid-column: 3; }
.today .cls .time { color: var(--sun); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c, var(--accent)); }
.kind-tag { font-family: var(--f-mono); font-size: .7rem; padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--today-ink) 16%, transparent); }
.panel .kind-tag { background: var(--sunk); color: var(--muted); }
@media (max-width: 480px) { .cls { grid-template-columns: 72px 1fr; } .cls .kind { display: none; } }

/* feed + deadlines */
.feed { display: grid; gap: 0; }
.feed-item { display: grid; grid-template-columns: 38px 1fr; gap: 12px; padding: 11px 0; border-top: 1px dashed var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; cursor: pointer; }
.feed-item:first-child { border-top: 0; }
.feed-item:hover .ft { color: var(--accent); }
.ficon { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: .9rem; background: color-mix(in srgb, var(--c, var(--accent)) 18%, var(--surface)); color: var(--c, var(--accent)); }
.ft { font-weight: 700; overflow-wrap: anywhere; }
.fm { color: var(--muted); font-size: .84rem; }
.dl { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px dashed var(--line); }
.dl:first-child { border-top: 0; }
.datebox { border-radius: 12px; background: var(--sunk); text-align: center; padding: 5px 0 6px; line-height: 1.05; }
.datebox b { display: block; font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; }
.datebox small { font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
.datebox.soon { background: var(--sun-soft); }
.datebox.soon b { color: var(--bad); }
.typechip { display: inline-block; font-size: .72rem; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--t, var(--accent)) 16%, var(--surface)); color: var(--t, var(--accent)); text-transform: uppercase; letter-spacing: .04em; }
.announce { background: var(--sun-soft); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; }
.announce .who { font-size: .8rem; color: var(--muted); font-weight: 700; }

/* subjects as notebooks */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.nb { position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 6px 18px 18px 6px; padding: 16px 16px 14px 26px; cursor: pointer; display: grid; gap: 6px; min-width: 0; transition: transform .15s, box-shadow .15s; }
.nb::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; border-radius: 6px 0 0 6px; background: var(--c); }
.nb::after { content: ""; position: absolute; left: 12px; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--c) 40%, transparent); }
.nb:hover { transform: translateY(-2px) rotate(-.3deg); box-shadow: var(--shadow); }
@media (prefers-reduced-motion: reduce) { .nb, .nb:hover { transition: none; transform: none; } }
.nb h3 { font-weight: 800; }
.nb .en { color: var(--muted); font-size: .86rem; font-style: italic; margin-top: -4px; }
.nb .meta { color: var(--muted); font-size: .84rem; }
.nb .foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.sun { background: var(--sun-soft); color: color-mix(in srgb, var(--sun) 60%, var(--ink)); }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }

/* list rows */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 13px 18px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--sunk); }
.item .t { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.item .m { color: var(--muted); font-size: .84rem; grid-column: 1; }
.item .r { grid-row: 1 / span 2; grid-column: 2; align-self: center; }

.empty { background: var(--surface); border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 12px; }
.empty.small { padding: 14px 16px; font-size: .92rem; color: var(--muted); }
.input { width: 100%; padding: 9px 13px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); }
.input:focus { border-color: var(--accent); outline: none; }
textarea.input { min-height: 72px; resize: vertical; }
label.field { display: grid; gap: 4px; font-size: .86rem; font-weight: 700; min-width: 0; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.split3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .split, .split3 { grid-template-columns: 1fr; } }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: .86rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* subject page header */
.cover { border-radius: var(--r); padding: 22px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 30%, var(--line)); display: grid; gap: 10px; }
.cover .en { color: var(--muted); font-style: italic; }
.people { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .88rem; color: var(--muted); }
.people b { color: var(--ink); font-weight: 700; }

/* zaliczenia */
.zal { display: grid; gap: 14px; scroll-margin-top: 80px; }
.zal-parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.zal-part { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.zal-part h3 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.zal-part p { overflow-wrap: anywhere; }
.zal-list { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: .92rem; }
.zal-when { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; font-size: .88rem; padding-top: 8px; border-top: 1px dashed var(--line); }
.zal-when b { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.zal-when.known span { font-weight: 800; color: var(--bad); }
.zal-final { background: var(--sunk); border-radius: 12px; padding: 12px 16px; display: grid; gap: 2px; }
.zal-note { background: var(--sun-soft); border-radius: 12px; padding: 12px 16px; display: grid; gap: 6px; font-size: .92rem; }
.zal-src { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.zal-src a { color: var(--accent); }
.zal-rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.zal-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr); gap: 6px 16px; align-items: center; padding: 13px 18px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; cursor: pointer; }
.zal-row:first-child { border-top: 0; }
.zal-row:hover { background: var(--sunk); }
.zal-row.head { cursor: default; background: var(--sunk); padding-block: 8px; }
.zal-row.head span { font-family: var(--f-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.zal-row .nm { font-weight: 800; display: flex; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.zal-row .cell { display: grid; gap: 2px; min-width: 0; font-size: .86rem; }
.zal-row .cell small { color: var(--muted); }
.zal-row .wh { font-size: .86rem; min-width: 0; }
.zal-row .wh.known { font-weight: 800; color: var(--bad); }
@media (max-width: 760px) {
  .zal-row { grid-template-columns: 1fr 1fr; }
  .zal-row .nm, .zal-row .wh { grid-column: 1 / -1; }
  .zal-row.head { display: none; }
}
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.rule { display: grid; gap: 4px; align-content: start; font-size: .92rem; }
.rule b { font-family: var(--f-display); font-size: 1.02rem; }
.scale { display: flex; flex-wrap: wrap; gap: 6px; }
.scale span { font-family: var(--f-mono); font-size: .78rem; padding: 2px 8px; border-radius: 8px; background: var(--sunk); }
.scale span.f { background: var(--bad-soft); color: var(--bad); }

/* calendar */
.cal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cal-head h2 { min-width: 11ch; }
.cal-scroll { overflow-x: auto; }
.cal { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) repeat(2, minmax(0, .55fr)); gap: 6px; min-width: 620px; }
.cal .dow { font-size: .74rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 0 6px; }
.day { min-height: 92px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); padding: 6px 7px; display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer; min-width: 0; }
.day:hover { border-color: var(--accent); }
.day.out { opacity: .4; }
.day.off { background: var(--sunk); }
.day.today { border: 2px solid var(--accent); }
.day.sel { box-shadow: 0 0 0 3px var(--sun); }
.day .dn { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1rem; }
.day .par { font-family: var(--f-mono); font-size: .62rem; font-weight: 500; color: var(--muted); }
.day .cnt { font-size: .7rem; color: var(--muted); }
.day .ev { font-size: .72rem; font-weight: 700; border-radius: 6px; padding: 1px 5px; background: color-mix(in srgb, var(--t) 16%, var(--surface)); color: var(--t); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* material */
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 4px; background: var(--sunk); border-radius: 999px; width: fit-content; max-width: 100%; }
.tab { background: none; border: 0; padding: 7px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 700; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.tab .c { font-family: var(--f-mono); font-size: .7rem; margin-left: 4px; color: var(--muted); }
.tabpanel { padding-top: 20px; display: flex; flex-direction: column; gap: 16px; }
.tldr { font-size: 1.14rem; line-height: 1.7; max-width: 66ch; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; }
.notes { margin: 0; padding: 0; list-style: none; counter-reset: n; display: grid; }
.notes li { counter-increment: n; display: grid; grid-template-columns: 2.2em 1fr auto; gap: 10px; padding: 11px 0; border-top: 1px dashed var(--line); align-items: start; }
.notes li:first-child { border-top: 0; }
.notes li::before { content: counter(n); font-family: var(--f-display); font-weight: 800; color: var(--accent); }
.notes li p { max-width: 68ch; min-width: 0; }
.concepts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.concept { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; align-content: start; }
.concept .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.concept .term { font-weight: 800; background: linear-gradient(transparent 60%, var(--mark) 60%); padding: 0 2px; }
.concept .pl { color: var(--muted); font-size: .86rem; font-style: italic; }
.concept .head .slide-ref { margin-left: auto; }
.slide-ref { font-family: var(--f-mono); font-size: .72rem; border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 1px 8px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.slide-ref:hover { color: var(--accent); border-color: var(--accent); }

/* flashcards */
.fc-wrap { display: grid; gap: 14px; justify-items: center; }
.fc { width: 100%; max-width: 560px; min-height: 240px; perspective: 1200px; background: none; border: 0; padding: 0; cursor: pointer; }
.fc-inner { position: relative; width: 100%; min-height: 240px; transition: transform .5s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
.fc.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face { position: absolute; inset: 0; backface-visibility: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); display: grid; place-items: center; padding: 30px; text-align: center; font-size: 1.12rem; overflow: auto; background-image: repeating-linear-gradient(transparent 0 31px, color-mix(in srgb, var(--accent) 10%, transparent) 31px 32px); }

/* quiz */

.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .k { font-family: var(--f-display); font-weight: 800; color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }

.explain { border-left: 4px solid var(--sun); padding: 4px 0 4px 12px; }
.why { background: var(--sun-soft); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; }

.why .ex { border-left: 3px solid var(--sun); padding-left: 10px; }

.why details { font-size: .88rem; color: var(--muted); }
.why details summary { cursor: pointer; font-weight: 700; }
.why .wait { color: var(--muted); font-size: .92rem; }
.score { font-family: var(--f-display); font-size: 3.4rem; font-weight: 800; line-height: 1; }

/* upload */
.drop { border: 2px dashed var(--line); border-radius: 18px; padding: 30px 20px; display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--sunk); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }

.drop b { font-family: var(--f-display); font-size: 1.1rem; }
.pipeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pipeline li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.sdot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); margin-top: 4px; }
.sdot.run { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
.sdot.ok { border-color: var(--good); background: var(--good); }
.sdot.err { border-color: var(--bad); background: var(--bad); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .sdot.run { animation: none; } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; }
.notice { padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: .92rem; }
.notice.err { background: var(--bad-soft); color: var(--bad); }
pre.slide { white-space: pre-wrap; font-family: var(--f-body); margin: 0; font-size: .94rem; max-height: 50vh; overflow: auto; }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(30, 20, 35, .45); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 20px; padding: 22px; width: min(560px, 100%); display: grid; gap: 12px; box-shadow: var(--shadow); max-height: 85vh; overflow: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: .92rem; font-weight: 700; z-index: 60; max-width: calc(100% - 32px); }
.foot-note { font-size: .82rem; color: var(--muted); }


/* tasks */
.tasks { display: grid; gap: 12px; }
.task { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px 18px 18px 6px; padding: 14px 16px 14px 22px; min-width: 0; }
.task::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; border-radius: 6px 0 0 6px; background: var(--c, var(--accent)); }
.task.done { opacity: .62; }
.task.done .task-title { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: color-mix(in srgb, var(--ink) 40%, transparent); }

.tick { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; font-weight: 800; font-size: 1.1rem; color: var(--good); grid-column: 1; grid-row: 1 / span 5; align-self: start; }
.tick:hover { border-color: var(--good); }

.task details { font-size: .92rem; }

.due { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 800; background: var(--sunk); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.due.soon { background: var(--sun-soft); color: color-mix(in srgb, var(--sun) 55%, var(--ink)); }
.due.now, .due.late { background: var(--bad-soft); color: var(--bad); }
.syncline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .86rem; color: var(--muted); }
.syncline .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }
.syncline .pulse.stale { background: var(--sun); }
.info-list .item { cursor: default; }
@media (max-width: 600px) { .info-list .item { grid-template-columns: 1fr; } .info-list .item .r { grid-row: auto; grid-column: 1; align-self: start; } }
.mini-task { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px dashed var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; cursor: pointer; }
.mini-task:first-child { border-top: 0; }
.mini-task .t { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.mini-task:hover .t { color: var(--accent); }

/* lessons */
.rich { display: grid; gap: 10px; max-width: 70ch; min-width: 0; }
.rich ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.rich b { font-weight: 800; }

.lesson { display: grid; gap: 22px; }
.lesson-intro { font-size: 1.08rem; line-height: 1.65; max-width: 66ch; }
.lsec { display: grid; gap: 12px; padding-top: 18px; border-top: 1px dashed var(--line); }
.lsec h2 { display: flex; gap: 12px; align-items: baseline; }
.lsec h2 .n { font-family: var(--f-display); color: var(--accent); font-size: 1rem; background: var(--accent-soft); border-radius: 999px; min-width: 28px; height: 28px; display: inline-grid; place-items: center; flex: none; }
.example { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.example .task { font-weight: 700; }
.example ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.example .ans { background: var(--good-soft); border-radius: 10px; padding: 8px 12px; }
.tip { background: var(--sun-soft); border-radius: 12px; padding: 10px 14px; font-size: .94rem; }
.formulas { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.formulas div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; min-width: 0; overflow-x: auto; }
.exercise { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.exercise .row details { font-size: .92rem; }
.exercise details summary { cursor: pointer; color: var(--accent); font-weight: 700; }
.exercise details[open] summary { margin-bottom: 4px; }
.course { display: grid; gap: 18px; }
.unit h3 { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
.unit h3 .u { font-family: var(--f-display); font-weight: 800; color: var(--muted); }
.lesson-row .t { display: flex; gap: 10px; align-items: baseline; }
.lesson-row .lnum { font-family: var(--f-display); font-weight: 800; color: var(--accent); min-width: 1.6em; }
.check { color: var(--good); font-weight: 800; }
.book { display: flex; gap: 12px; align-items: center; font-size: .9rem; color: var(--muted); }
.book .spine { width: 30px; height: 40px; border-radius: 3px 6px 6px 3px; background: #2a1414; border-left: 5px solid #b3261e; flex: none; }
.lnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }
/* ===== prosty język ===== */
.simple { display: grid; gap: 16px; max-width: 760px; }
.simple-intro { background: var(--accent-soft); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 6px; }
.simple-intro .eyebrow { color: var(--accent); }
.simple-intro p { font-size: 1.08rem; line-height: 1.65; }
.spart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.spart h2 { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; }
.spart h2 .emo { font-size: 1.5rem; width: 42px; height: 42px; border-radius: 12px; background: var(--sunk); display: grid; place-items: center; flex: none; }
.spart .txt { font-size: 1.02rem; line-height: 1.65; }
.spart .ex { background: var(--sun-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; line-height: 1.6; }
.spart .ex b.lbl, .spart .rem b.lbl { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
.spart .rem { border-left: 4px solid var(--good); padding: 4px 0 4px 12px; font-weight: 700; }
.swords { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.swords div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.swords b { color: var(--accent); }
.scheck details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.scheck summary { cursor: pointer; font-weight: 700; }
.scheck details[open] summary { margin-bottom: 6px; }
.scheck .ans { background: var(--good-soft); border-radius: 10px; padding: 8px 12px; }
.tab.simple-tab { position: relative; }
.tab.simple-tab::before { content: "✨"; margin-right: 4px; }
/* ===== instrukcja (animowany przewodnik) ===== */
.helpbtn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--accent); font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; cursor: pointer; display: grid; place-items: center; flex: none; transition: transform .2s, border-color .2s; }
.helpbtn:hover { border-color: var(--accent); transform: rotate(-8deg) scale(1.06); }
.helpbtn.nudge { animation: tv-nudge 2.4s ease-in-out 3; }
@keyframes tv-nudge { 0%,70%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 85% { box-shadow: 0 0 0 10px transparent; } }
.tour { position: fixed; inset: 0; z-index: 80; pointer-events: none; }
.tour-shade { position: fixed; inset: 0; background: rgba(30, 20, 35, .55); pointer-events: auto; opacity: 0; animation: tv-fade .35s ease forwards; }
.tour.has-hole .tour-shade { background: transparent; }
.tour-hole { position: fixed; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(30, 20, 35, .55); transition: top .55s cubic-bezier(.65,0,.25,1), left .55s cubic-bezier(.65,0,.25,1), width .55s cubic-bezier(.65,0,.25,1), height .55s cubic-bezier(.65,0,.25,1), opacity .3s; pointer-events: none; }
.tour-hole::after { content: ""; position: absolute; inset: -5px; border-radius: 18px; border: 2.5px solid var(--sun); animation: tv-pulse 1.6s ease-out infinite; }
@keyframes tv-pulse { 0% { transform: scale(.96); opacity: 1; } 100% { transform: scale(1.18); opacity: 0; } }
@keyframes tv-fade { to { opacity: 1; } }
.tour-card { position: fixed; width: min(390px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border-radius: 20px; box-shadow: 0 18px 50px -12px rgba(20, 10, 25, .45); padding: 18px 18px 14px; display: grid; gap: 10px; pointer-events: auto; transition: top .55s cubic-bezier(.65,0,.25,1), left .55s cubic-bezier(.65,0,.25,1); }
.tour-card.enter { animation: tv-pop .45s cubic-bezier(.2,.9,.3,1.25); }
@keyframes tv-pop { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
.tour-card .step { font-family: var(--f-mono); font-size: .74rem; color: var(--muted); letter-spacing: .04em; }
.tour-card h2 { font-size: 1.22rem; }
.tour-card p { color: var(--muted); font-size: .95rem; }
.tour-card p b { color: var(--ink); }
.tour-dots { display: flex; gap: 5px; }
.tour-dots i { width: 7px; height: 7px; border-radius: 99px; background: var(--line); transition: width .3s, background .3s; }
.tour-dots i.on { width: 20px; background: var(--accent); }
.tour-foot { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin-top: 2px; }
.tour-foot .row { gap: 6px; }
.tv { height: 118px; border-radius: 14px; background: var(--sunk); position: relative; overflow: hidden; display: grid; place-items: center; }
.tv * { box-sizing: border-box; }
/* 0: Teams -> skrót */
.tv-files { position: absolute; left: 16px; top: 50%; display: grid; gap: 6px; transform: translateY(-50%); }
.tv-file { width: 34px; height: 24px; border-radius: 5px; background: #5b5fc7; opacity: 0; animation: tv-fly 3s ease-in-out infinite; }
.tv-file:nth-child(2) { background: #c0702c; animation-delay: .35s; } .tv-file:nth-child(3) { background: #3f8a52; animation-delay: .7s; }
@keyframes tv-fly { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: 1; } 55% { opacity: 1; transform: translateX(118px) scale(.5); } 65%,100% { opacity: 0; transform: translateX(130px) scale(.3); } }
.tv-out { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); width: 112px; padding: 10px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 6px; }
.tv-out span { height: 7px; border-radius: 4px; background: var(--accent-soft); transform-origin: left; animation: tv-grow 3s ease-out infinite; }
.tv-out span:nth-child(1) { background: var(--accent); width: 60%; animation-delay: .9s; } .tv-out span:nth-child(2) { animation-delay: 1.1s; } .tv-out span:nth-child(3) { width: 80%; animation-delay: 1.3s; } .tv-out span:nth-child(4) { width: 50%; background: var(--sun); animation-delay: 1.5s; }
@keyframes tv-grow { 0%,25% { transform: scaleX(0); } 45%,90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
.tv-arrow { position: absolute; left: 50%; top: 50%; font-size: 1.4rem; color: var(--accent); transform: translate(-80%, -50%); animation: tv-bob 1.2s ease-in-out infinite; }
@keyframes tv-bob { 50% { transform: translate(-40%, -50%); } }
/* 1: hub rows */
.tv-hub { width: 82%; display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; }
.tv-hub div { display: grid; gap: 6px; align-content: start; }
.tv-hub span { height: 16px; border-radius: 6px; background: var(--surface); box-shadow: var(--shadow); opacity: 0; animation: tv-in 3.2s ease-out infinite; }
.tv-hub span.dark { background: var(--today-bg); height: 34px; }
.tv-hub span.sun { background: var(--sun-soft); border-left: 4px solid var(--sun); }
.tv-hub span:nth-child(2) { animation-delay: .25s; } .tv-hub span:nth-child(3) { animation-delay: .5s; }
.tv-hub div:nth-child(2) span { animation-delay: .6s; } .tv-hub div:nth-child(2) span:nth-child(2) { animation-delay: .85s; } .tv-hub div:nth-child(2) span:nth-child(3) { animation-delay: 1.1s; }
@keyframes tv-in { 0% { opacity: 0; transform: translateY(8px); } 12%,88% { opacity: 1; transform: none; } 100% { opacity: 0; } }
/* 2: group picker */
.tv-seg { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); position: relative; }
.tv-seg b { position: relative; z-index: 1; padding: 6px 12px; font-size: .82rem; font-family: var(--f-mono); }
.tv-seg .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: 58px; border-radius: 999px; background: var(--accent-soft); border: 2px solid var(--accent); animation: tv-slide 4s cubic-bezier(.65,0,.25,1) infinite; }
@keyframes tv-slide { 0%,20% { transform: translateX(0); } 33%,53% { transform: translateX(62px); } 66%,86% { transform: translateX(124px); } 100% { transform: translateX(0); } }
.tv-cursor { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--sun); border: 2px solid var(--surface); bottom: 26px; left: 50%; animation: tv-cur 4s cubic-bezier(.65,0,.25,1) infinite; }
@keyframes tv-cur { 0%,20% { transform: translateX(-80px); } 33%,53% { transform: translateX(-18px); } 66%,86% { transform: translateX(44px); } 100% { transform: translateX(-80px); } }
/* 3: notebooks */
.tv-books { display: flex; gap: 10px; }
.tv-books i { width: 44px; height: 60px; border-radius: 4px 8px 8px 4px; background: var(--c); box-shadow: inset 5px 0 0 rgba(0,0,0,.15), var(--shadow); animation: tv-lift 2.4s ease-in-out infinite; }
.tv-books i:nth-child(2) { animation-delay: .3s; } .tv-books i:nth-child(3) { animation-delay: .6s; } .tv-books i:nth-child(4) { animation-delay: .9s; }
@keyframes tv-lift { 0%,60%,100% { transform: none; } 30% { transform: translateY(-10px) rotate(-3deg); } }
/* 4: tabs */
.tv-tabs { display: grid; gap: 10px; justify-items: center; }
.tv-tabrow { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); position: relative; font-size: .72rem; font-weight: 800; }
.tv-tabrow b { position: relative; z-index: 1; width: 52px; text-align: center; padding: 4px 0; }
.tv-tabrow .pill { position: absolute; top: 3px; bottom: 3px; left: 3px; width: 52px; border-radius: 999px; background: var(--accent-soft); border: 2px solid var(--accent); animation: tv-tabs 6s cubic-bezier(.65,0,.25,1) infinite; }
@keyframes tv-tabs { 0%,13% { transform: translateX(0); } 17%,30% { transform: translateX(54px); } 34%,47% { transform: translateX(108px); } 51%,64% { transform: translateX(162px); } 68%,81% { transform: translateX(216px); } 85%,100% { transform: translateX(0); } }
.tv-card3d { width: 120px; height: 46px; perspective: 400px; }
.tv-card3d div { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: tv-flip 3s ease-in-out infinite; }
.tv-card3d span { position: absolute; inset: 0; border-radius: 9px; display: grid; place-items: center; backface-visibility: hidden; font-size: .78rem; font-weight: 800; background: var(--surface); box-shadow: var(--shadow); }
.tv-card3d span + span { transform: rotateY(180deg); background: var(--accent); color: var(--accent-ink); }
@keyframes tv-flip { 0%,35% { transform: none; } 50%,85% { transform: rotateY(180deg); } 100% { transform: rotateY(360deg); } }
/* 5: tasks */
.tv-tasks { width: 76%; display: grid; gap: 7px; }

  // ================= quiz: proste "dlaczego" przy każdej odpowiedzi =================

  async function getWhy(mid) {

NOTATKI Z MATERIAŁU:

      const r = await S.sample.json(prompt, { modelTier: "default" });

  // ================= instrukcja: animowany przewodnik po stronie =================
  const TV = {

  };
  const TOUR = [
    { view: "home", title: "Cześć! To jest Skrót BM", text: "Wszystko z Teams dla naszego roku w jednym miejscu: <b>skróty wykładów, fiszki i quizy</b>, Twój plan, zadania i terminy. Pokażę Ci w minutę, gdzie co jest.", art: "intro" },
    { view: "home", nav: "home", title: "Start — Twój dzień", text: "Strona główna: <b>dzisiejsze zajęcia</b>, ogłoszenia od starosty, <b>nowe materiały</b> i najbliższe terminy. Zaglądaj tu rano przed zajęciami.", art: "hub" },
    { view: "home", sel: "section.today", title: "Ustaw swoją grupę", text: "Wybierz <b>grupę (C111–C113)</b> i <b>podgrupę lab A/B</b>. Wtedy plan, zadania i kalendarz pokazują tylko to, co dotyczy Ciebie.", art: "group" },
    { view: "materials", nav: "materials", title: "Materiały — każdy przedmiot osobno", text: "Kliknij okładkę przedmiotu. W środku: <b>lekcje po kolei</b>, „Jak zaliczyć”, terminy i <b>quiz z całości</b>. Masz coś z Teams? Użyj „Wgraj materiał”.", art: "books" },
    { view: "materials", title: "Jak uczyć się z materiału", text: "Każdy materiał ma zakładki: <b>✨ Prosty język</b> (wytłumaczone jak dla 12-latka, na przykładach), <b>Skrót</b> (najważniejsze), <b>Notatka</b> (pełniej), <b>Pojęcia</b>, <b>Fiszki</b> — kliknij, żeby odwrócić — i <b>Quiz</b> z wynikiem. „Źródło” pokazuje, skąd to jest.", art: "tabs" },

    { view: "grading", nav: "grading", title: "Zaliczenia — jak zdać", text: "Dla każdego przedmiotu: <b>forma zaliczenia, progi i kiedy</b>. Pomarańczowy znaczek <b>„z sylabusa”</b> znaczy, że informacja jest z sylabusa, a nie od prowadzącego.", art: "grade" },
    { view: "calendar", nav: "calendar", title: "Kalendarz", text: "Miesiąc z <b>kolokwiami, egzaminami, projektami</b> i sesją. Kropka w kolorze typu terminu. Możesz dodać własny termin — zobaczy go cały rok.", art: "cal" },
    { view: "home", sel: "#helpbtn", title: "Gotowe!", text: "Tę instrukcję otworzysz zawsze przyciskiem <b>?</b> u góry strony. Coś się nie zgadza w materiale? Zgłoś to przyciskiem przy materiale.", art: "done", last: true },
  ];
  let tourState = null;
  function tourTarget(st) {
    if (st.nav) return document.querySelector(`#nav [data-key="${st.nav}"]`);

  }
  function tourPlace() {
    if (!tourState) return;

    const r = el && el.getBoundingClientRect();

  function tourShow(i) {

  })();
})();
