name: Kopia planu i kalendarzy z plan-bm

# plan.skrotbm.pl to stary adres planu. Strony przekierowują na plan.zdawalni.pl, ale aplikacje kalendarza
# (subskrypcje kalendarz/C112.ics w telefonach) i stare wersje aplikacji nie przechodzą przez przekierowanie strony.
# Dlatego trzymamy tu prawdziwe kopie plan.json, plan/*.json i kalendarz/*.ics z publicznego repo plan-bm.
# Bez tokenów: repo plan-bm jest publiczne. Commit tylko przy zmianie (plus raz dziennie kopia.txt,
# żeby GitHub nie wyłączył harmonogramu po 60 dniach bez zmian).

on:
  schedule:
    - cron: "10,40 * * * *"   # co 30 min (czas UTC); plan-bm publikuje rano i co godzinę o :20
  workflow_dispatch:           # ręcznie: zakładka Actions → Run workflow

permissions:
  contents: write

concurrency:
  group: kopia-planu
  cancel-in-progress: false

jobs:
  kopia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: kowalczykbartek74-cpu/plan-bm
          ref: main
          path: _zrodlo
          sparse-checkout: |
            plan.json
            plan
            kalendarz
          sparse-checkout-cone-mode: false

      - name: Sprawdź i skopiuj
        run: |
          set -e
          node -e 'const p=require("./_zrodlo/plan.json"); if(!p.groups||!Object.keys(p.groups).length) throw new Error("plan.json bez grup")'
          for f in C111 C112 C113; do test -s "_zrodlo/kalendarz/$f.ics" || { echo "::error::Brak kalendarz/$f.ics w plan-bm"; exit 1; }; done
          cp _zrodlo/plan.json plan.json
          rm -rf plan kalendarz
          cp -r _zrodlo/kalendarz kalendarz
          if [ -d _zrodlo/plan ]; then cp -r _zrodlo/plan plan; fi
          rm -rf _zrodlo
          date -u +%F > kopia.txt

      - name: Zapisz
        run: |
          git config user.name "plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Bez zmian."; exit 0; fi
          git commit -m "Kopia planu i kalendarzy z plan-bm"
          git push
